# Web servers, reverse proxies, load balancers, API gateways, and network appliances.
technologies:
  # ── Web Servers ──
  - id: nginx
    name: NGINX
    category: server
    layer: reverse_proxy
    open_source: true
    vendor: F5/NGINX
    default_ports: [80, 443]
    docker_image: nginx:alpine
    fingerprints:
      - signal: server
        match: nginx
        field: proxy_type
        confidence: 0.9
  - id: apache
    name: Apache HTTP Server
    category: server
    layer: origin
    open_source: true
    vendor: Apache Software Foundation
    default_ports: [80, 443]
    docker_image: httpd:alpine
    aliases: [httpd, apache2]
    fingerprints:
      - signal: server
        match: apache
        field: proxy_type
        confidence: 0.9
  - id: caddy
    name: Caddy
    category: server
    layer: reverse_proxy
    open_source: true
    vendor: Caddy
    default_ports: [80, 443]
    docker_image: caddy:alpine
    fingerprints:
      - signal: server
        match: caddy
        field: proxy_type
        confidence: 1.0
  - id: litespeed
    name: LiteSpeed
    category: server
    layer: origin
    vendor: LiteSpeed Technologies
    default_ports: [80, 443]
    fingerprints:
      - signal: server
        match: litespeed
        field: proxy_type
        confidence: 1.0
  - id: iis
    name: Microsoft IIS
    category: server
    layer: origin
    vendor: Microsoft
    default_ports: [80, 443]
    fingerprints:
      - signal: server
        match: iis
        field: proxy_type
        confidence: 1.0

  # ── Reverse Proxies & Load Balancers ──
  - id: traefik
    name: Traefik
    category: server
    layer: reverse_proxy
    open_source: true
    vendor: Traefik Labs
    default_ports: [80, 443, 8080]
    docker_image: traefik:v3.0
    fingerprints:
      - signal: server
        match: traefik
        field: proxy_type
        confidence: 1.0
  - id: envoy
    name: Envoy Proxy
    category: server
    layer: service_mesh
    open_source: true
    vendor: CNCF/Lyft
    default_ports: [80, 443, 9901]
    docker_image: envoyproxy/envoy:v1.31-latest
    fingerprints:
      - signal: header
        key: x-envoy-upstream-service-time
        field: proxy_type
        confidence: 1.0
  - id: haproxy
    name: HAProxy
    category: server
    layer: load_balancer
    open_source: true
    vendor: HAProxy Technologies
    default_ports: [80, 443]
    docker_image: haproxy:alpine
  - id: varnish
    name: Varnish Cache
    category: server
    layer: cdn_edge
    open_source: true
    vendor: Varnish Software
    default_ports: [80, 6081]
    docker_image: varnish:stable
  - id: f5
    name: F5 BIG-IP
    category: server
    layer: load_balancer
    vendor: F5 Networks
    default_ports: [443, 8443]
  - id: citrix-netscaler
    name: Citrix NetScaler
    category: server
    layer: load_balancer
    vendor: Citrix
    default_ports: [443, 9443]
    aliases: [netscaler]

  # ── API Gateways ──
  - id: kong
    name: Kong Gateway
    category: gateway
    layer: api_gateway
    open_source: true
    vendor: Kong Inc
    default_ports: [8000, 8443, 8001]
    docker_image: kong:latest
    fingerprints:
      - signal: header
        key: x-kong-request-id
        field: proxy_type
        confidence: 1.0
  - id: tyk
    name: Tyk Gateway
    category: gateway
    layer: api_gateway
    open_source: true
    vendor: Tyk Technologies
    default_ports: [8080]
    docker_image: tykio/tyk-gateway:latest
    fingerprints:
      - signal: header
        key: x-tyk-api-expires
        field: proxy_type
        confidence: 1.0
  - id: apigee
    name: Apigee
    category: gateway
    layer: api_gateway
    cloud_provider: gcp
    vendor: Google
    fingerprints:
      - signal: header
        key: x-apigee-fault-code
        field: proxy_type
        confidence: 1.0
  - id: azure-apim
    name: Azure API Management
    category: gateway
    layer: api_gateway
    cloud_provider: azure
    vendor: Microsoft
    fingerprints:
      - signal: header
        key: apim-request-id
        field: proxy_type
        value: azure_apim
        confidence: 1.0

  # ── CDN Providers ──
  - id: akamai
    name: Akamai
    category: cdn
    layer: cdn_edge
    vendor: Akamai Technologies
    fingerprints:
      - signal: cname
        match: ".akamaiedge.net"
        field: proxy_type
        confidence: 1.0
  - id: fastly
    name: Fastly
    category: cdn
    layer: cdn_edge
    vendor: Fastly
    fingerprints:
      - signal: cname
        match: ".fastly.net"
        field: proxy_type
        confidence: 1.0
  - id: keycdn
    name: KeyCDN
    category: cdn
    layer: cdn_edge
    vendor: proinity
  - id: bunnycdn
    name: BunnyCDN
    category: cdn
    layer: cdn_edge
    vendor: BunnyCDN
  - id: sucuri
    name: Sucuri
    category: cdn
    layer: cdn_edge
    vendor: Sucuri/GoDaddy
    tags: [waf]

  # ── Network Appliances ──
  - id: unifi
    name: UniFi Network
    category: server
    vendor: Ubiquiti
    default_ports: [8443, 8080]
    tags: [network-controller]
    fingerprints:
      - signal: body
        match: "unifi network"
        field: backend_services
        confidence: 1.0
      - signal: body
        match: "network.unifi"
        field: backend_services
        confidence: 1.0
      - signal: path
        match: "/manage/account/login"
        field: backend_services
        confidence: 0.95
  - id: omada
    name: TP-Link Omada
    category: server
    vendor: TP-Link
    default_ports: [8043, 8088]
    tags: [network-controller]
    fingerprints:
      - signal: body
        match: "omada controller"
        field: backend_services
        confidence: 1.0
  - id: aruba
    name: Aruba Networks
    category: server
    vendor: HPE/Aruba
    tags: [network-controller]
    fingerprints:
      - signal: body
        match: "aruba networks"
        field: backend_services
        confidence: 0.9
  - id: aruba-instant
    name: Aruba Instant
    category: server
    vendor: HPE/Aruba
    tags: [wireless-ap]
    fingerprints:
      - signal: body
        match: "aruba instant"
        field: backend_services
        confidence: 1.0
  - id: openwrt
    name: OpenWrt
    category: server
    open_source: true
    vendor: OpenWrt Project
    tags: [router]
    fingerprints:
      - signal: body
        match: "openwrt"
        field: backend_services
        confidence: 1.0
      - signal: body
        match: "luci"
        field: backend_services
        confidence: 0.9
