# Container runtimes, orchestrators, registries, service meshes, and private cloud.
technologies:
  # ── Container Runtimes ──
  - id: docker
    name: Docker
    category: container
    open_source: true
    vendor: Docker Inc
    tags: [runtime]
  - id: podman
    name: Podman
    category: container
    open_source: true
    vendor: Red Hat
    tags: [runtime, rootless]
  - id: containerd
    name: containerd
    category: container
    open_source: true
    vendor: CNCF
    tags: [runtime]
  - id: cri-o
    name: CRI-O
    category: container
    open_source: true
    vendor: CNCF/Red Hat
    tags: [runtime, k8s-native]

  # ── Orchestrators ──
  - id: kubernetes
    name: Kubernetes
    category: container
    open_source: true
    vendor: CNCF
    default_ports: [6443, 10250]
    tags: [orchestrator]
    aliases: [k8s]
    fingerprints:
      - signal: header
        key: x-kubernetes-pf-flowschema-uid
        field: infra_layer
        confidence: 1.0
  - id: k3s
    name: K3s
    category: container
    open_source: true
    vendor: SUSE/Rancher
    default_ports: [6443]
    tags: [orchestrator, lightweight]
  - id: k0s
    name: k0s
    category: container
    open_source: true
    vendor: Mirantis
    default_ports: [6443]
    tags: [orchestrator, lightweight]
  - id: microk8s
    name: MicroK8s
    category: container
    open_source: true
    vendor: Canonical
    default_ports: [16443]
    tags: [orchestrator, lightweight]
  - id: openshift
    name: OpenShift
    category: container
    vendor: Red Hat
    default_ports: [6443, 8443]
    tags: [orchestrator]
    aliases: [ocp]
    fingerprints:
      - signal: header
        key: x-openshift-token
        field: backend_services
        confidence: 1.0
      - signal: body
        match: "openshift web console"
        field: backend_services
        confidence: 1.0
      - signal: path
        match: "/apis/apps.openshift.io"
        field: backend_services
        confidence: 1.0
  - id: nomad
    name: HashiCorp Nomad
    category: container
    open_source: true
    vendor: HashiCorp
    default_ports: [4646, 4647, 4648]
    docker_image: hashicorp/nomad:latest
    tags: [orchestrator]
  - id: docker-swarm
    name: Docker Swarm
    category: container
    open_source: true
    vendor: Docker Inc
    default_ports: [2377, 7946]
    tags: [orchestrator]

  # ── Service Meshes ──
  - id: istio
    name: Istio
    category: container
    open_source: true
    vendor: CNCF/Google
    tags: [service-mesh]
  - id: linkerd
    name: Linkerd
    category: container
    open_source: true
    vendor: CNCF/Buoyant
    tags: [service-mesh]
  - id: consul
    name: HashiCorp Consul
    category: container
    open_source: true
    vendor: HashiCorp
    default_ports: [8500, 8501, 8600]
    docker_image: hashicorp/consul:latest
    tags: [service-mesh, service-discovery]
    fingerprints:
      - signal: path
        match: "/v1/catalog/nodes"
        field: backend_services
        confidence: 1.0
      - signal: header
        key: x-consul-index
        field: backend_services
        confidence: 1.0
  - id: cilium
    name: Cilium
    category: container
    open_source: true
    vendor: CNCF/Isovalent
    tags: [service-mesh, ebpf, cni]

  # ── Service Discovery ──
  - id: nacos
    name: Nacos
    category: container
    open_source: true
    vendor: Alibaba
    default_ports: [8848]
    docker_image: nacos/nacos-server:latest
    tags: [service-discovery, config]
    fingerprints:
      - signal: path
        match: "/nacos/v1/cs/configs"
        field: backend_services
        confidence: 1.0
      - signal: body
        match: "nacos server"
        field: backend_services
        confidence: 0.95

  # ── Container Registries ──
  - id: dockerhub
    name: Docker Hub
    category: container
    vendor: Docker Inc
    tags: [registry]
    aliases: [docker-registry]
  - id: ghcr
    name: GitHub Container Registry
    category: container
    vendor: GitHub/Microsoft
    tags: [registry]
  - id: harbor
    name: Harbor
    category: container
    open_source: true
    vendor: CNCF/VMware
    default_ports: [80, 443]
    tags: [registry]
    fingerprints:
      - signal: path
        match: "/api/v2.0/systeminfo"
        field: backend_services
        confidence: 1.0
      - signal: body
        match: harbor_version
        field: backend_services
        confidence: 0.95
      - signal: body
        match: "harbor registry"
        field: backend_services
        confidence: 0.9
      - signal: header
        key: x-harbor-csrf-token
        field: backend_services
        confidence: 1.0
  - id: quay
    name: Quay
    category: container
    open_source: true
    vendor: Red Hat
    tags: [registry]
    aliases: [quay-io]
    fingerprints:
      - signal: path
        match: "/api/v1/discovery"
        field: backend_services
        confidence: 0.9
      - signal: body
        match: "quay.io"
        field: backend_services
        confidence: 0.9

  # ── Package Management ──
  - id: helm
    name: Helm
    category: container
    open_source: true
    vendor: CNCF
    tags: [package-manager, k8s]
  - id: kustomize
    name: Kustomize
    category: container
    open_source: true
    vendor: Kubernetes SIG
    tags: [config-management, k8s]

  # ── Private Cloud Platforms ──
  - id: openstack
    name: OpenStack
    category: container
    open_source: true
    vendor: OpenInfra Foundation
    tags: [private-cloud]
    fingerprints:
      - signal: body
        match: "powered by openstack"
        field: backend_services
        confidence: 1.0
      - signal: header
        key: x-openstack-request-id
        field: backend_services
        confidence: 1.0
  - id: openstack-keystone
    name: OpenStack Keystone
    category: auth
    open_source: true
    vendor: OpenInfra Foundation
    default_ports: [5000, 35357]
    tags: [private-cloud, identity]
    fingerprints:
      - signal: path
        match: "/identity/v3"
        field: backend_services
        confidence: 1.0
      - signal: path
        match: "/v2.0/tokens"
        field: backend_services
        confidence: 0.9
  - id: openstack-horizon
    name: OpenStack Horizon
    category: monitoring
    open_source: true
    vendor: OpenInfra Foundation
    default_ports: [80, 443]
    tags: [private-cloud, dashboard]
    fingerprints:
      - signal: body
        match: "openstack dashboard"
        field: backend_services
        confidence: 1.0
  - id: proxmox
    name: Proxmox VE
    category: container
    open_source: true
    vendor: Proxmox
    default_ports: [8006]
    tags: [private-cloud, hypervisor]
    fingerprints:
      - signal: body
        match: "proxmox virtual environment"
        field: backend_services
        confidence: 1.0
      - signal: path
        match: "/api2/json"
        field: backend_services
        confidence: 0.95
      - signal: body
        match: pvemanagerversion
        field: backend_services
        confidence: 1.0
  - id: cloudstack
    name: Apache CloudStack
    category: container
    open_source: true
    vendor: Apache Software Foundation
    default_ports: [8080]
    tags: [private-cloud]
    fingerprints:
      - signal: path
        match: "/client/api"
        field: backend_services
        confidence: 0.95
      - signal: body
        match: cloudstack
        field: backend_services
        confidence: 0.85
